# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

indent-width = 4
line-length = 120
preview = true
respect-gitignore = true
target-version = "py312"
force-exclude = true

###########
# formatting
###########

[format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = true


###########
# linting
###########

[lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
fixable = ["ALL"]
future-annotations = true
select = ["ALL"]
task-tags = ["TODO", "FIXME", "NOTE", "BUG", "OPTIMIZE", "HACK"]
typing-extensions = false

ignore = [
  "E501",   # line length handled by formatter
  "COM812", # Trailing comma missing handled by formatter
  "S101",   # assert used (ok in tests/internal tools)
  "D100",   # Missing docstring in public module
  "D101",   # Missing docstring in public class
  "D104",   # Missing docstring in public package
  "D105",   # Missing docstring in magic method
  "D107",   # Missing docstring in init
  "D203",   # 1 blank line required before class docstring
  "D213",   # Multi-line docstring summary should start at the second line
  "CPY",    # copyright
  "TC001",  # Move application import into type-checking block
  "TC002",  # Move third-party import into type-checking block
  "TC003"   # Move standard library import into type-checking block
]

[lint.per-file-ignores]
# Allow missing annotations in migrations
"**/migrations/**/*.py" = [
  "E501",   # line length handled by formatter
  "D",      # docstrings
  "RUF012", # typing classvar not needed in migrations
  "ANN",    # missing type annotations
  "ERA001", # Commented-out code
  "ARG",    # missing function argument annotations
]

"**/tests/**/*.py" = [
  "S101",                 # allow asserts in tests
  "PLC2701",              # I don't care about access modifiers when I'm testing
  "PLR0914"               # I don't care that you think I'm creating to many local variables, I'm testing!
]

[lint.flake8-bandit]
check-typed-exception = true

[lint.flake8-builtins]
strict-checking = true

[lint.flake8-errmsg]
max-string-length = 0

[lint.flake8-type-checking]
strict = true

[lint.flake8-tidy-imports]
ban-lazy = "all"
ban-relative-imports = "all"

[lint.isort]
combine-as-imports = true
force-sort-within-sections = true
split-on-trailing-comma = false

[lint.pep8-naming]
classmethod-decorators = ["field_validator", "declared_attr", "model_validator"]

[lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]
ignore-var-parameters = true

[lint.pylint]
allow-magic-value-types = []

[lint.ruff]
parenthesize-tuple-in-subscript = true